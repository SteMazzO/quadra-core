[profile]
id = "esselunga"
version = 1
currency = "EUR"
calibrated = true

[format]
decimal_separator = ","
decimal_places = 2
money = '\d{1,3},\d{2}'
# The VAT bracket, e.g. '*c'. OCR mangles the asterisk, so match on shape;
# the captured group is the letter. Only real brackets: a misread '*e' is no code.
vat_code = '\W{0,2}[A-Za-z]?([A-Da-d])\W{0,2}'
max_quantity = 100

[layout]
has_quantity_column = false
has_unit_price_column = false
quantity_modifier = '^[\s.,;:]*(?P<qty>\d{1,3})[\s.,;:]*[xX][\s.,;:]*(?P<unit>\d{1,3},\d{2})[\s.,;:]*$'
modifier_position = "before"

[fingerprint]
# The VAT number identifies the company, not a single branch.
anchors = ["Esselunga S.p.A.", "04916380159", "FIDATY"]
min_ratio = 0.8

[regions]
# 'EURO' also matches the 'TOTALE EURO' line; find_item_region allows for that.
items_start_after = ["EURO"]
# The later anchors end the items when the total itself is unreadable.
items_end_before = ["TOTALE EURO", "DI CUI IVA", "PAGAMENTO"]

[[rules]]
name = "total"
pattern = '(?i)\bT[O0]T\S{0,3}\s+EURO\b'

# Kept apart from payments, which exceed the total by the change on a cash sale.
[[rules]]
name = "change"
pattern = '(?i)^\s*resto\b'

[[rules]]
name = "payment"
pattern = '(?i)\bpagamento\b'

[[rules]]
name = "discount"
pattern = '(?i)\bsconto\b'

[[rules]]
name = "noise"
# 'di cui IVA' and the '*a = IVA 04%' legend carry amounts that are not items.
pattern = '(?i)(carta\s+fidaty|raccolta\s+punti|saldo|punti|p\.i\.|^\s*euro\s*$|di\s+cui|\biva\s*\d)'
