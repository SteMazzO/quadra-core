[profile]
id = "esselunga"
version = 1
currency = "EUR"
calibrated = true
sample_size = 2

[format]
decimal_separator = ","
decimal_places = 2
money = '\d{1,3},\d{2}'
quantity = '\d+(?:,\d{1,3})?'
# The VAT bracket, e.g. '*c'. OCR mangles the asterisk, so match on shape;
# the captured group is the letter.
vat_code = '\W{0,2}[A-Za-z]?([A-Za-z])\W{0,2}'
max_quantity = 100

[layout]
has_quantity_column = false
has_unit_price_column = false
quantity_modifier = '^[\s.,;:]*(?P<qty>\d{1,3})[\s.,;:]*[xX][\s.,;:]*(?P<unit>\d{1,3},\d{2})[\s.,;:]*$'
modifier_position = "before"

[fingerprint]
# The VAT number identifies the company, not a single branch.
anchors = ["Esselunga S.p.A.", "04916380159"]
min_ratio = 0.8

[regions]
# 'EURO' also matches the 'TOTALE EURO' line; find_item_region allows for that.
items_start_after = ["EURO"]
items_end_before = ["TOTALE EURO"]

[[rules]]
name = "total"
pattern = '(?i)\bT[O0]T\S{0,3}\s+EURO\b'

# Kept apart from payments, which exceed the total by the change on a cash sale.
[[rules]]
name = "change"
pattern = '(?i)^\s*resto\b'

[[rules]]
name = "payment"
pattern = '(?i)\bpagamento\b'

[[rules]]
name = "discount"
pattern = '(?i)\bsconto\b'

[[rules]]
name = "noise"
pattern = '(?i)(carta\s+fidaty|raccolta\s+punti|saldo|punti|p\.i\.|^\s*euro\s*$)'
