# Esselunga profile.

[profile]
id = "esselunga"
version = 1
currency = "EUR"
calibrated = true
sample_size = 2

[format]
decimal_separator = ","
decimal_places = 2
# Observed range 0,01 to 23,92. Three integer digits allows up to 999,99. Revisit
# if a receipt ever goes above that.
money = '\d{1,3},\d{2}'
quantity = '\d+(?:,\d{1,3})?'
# The VAT bracket, printed between the description and the price; the receipt
# heads that column IVA. It is an asterisk plus a letter, but the asterisk is
# small and comes back as almost anything - so far * « » # x s i v " and nothing
# at all - so this matches on shape instead: a couple of non-digits ending in a
# letter or two. Position does the rest, since only the word immediately left of
# the price is considered. The captured group is the bracket letter, which is
# always the last letter of the marker.
vat_code = '\W{0,2}[A-Za-z]?([A-Za-z])\W{0,2}'
max_quantity = 100

[layout]
has_quantity_column = false
has_unit_price_column = false
quantity_modifier = '^[\s.,;:]*(?P<qty>\d{1,3})[\s.,;:]*[xX][\s.,;:]*(?P<unit>\d{1,3},\d{2})[\s.,;:]*$'
modifier_position = "before"

[fingerprint]
# The VAT number is the same on both receipts, so it identifies the company
# rather than one branch. That makes it the most stable anchor available.
anchors = ["Esselunga S.p.A.", "04916380159"]
min_ratio = 0.8

[regions]
# 'EURO' is the right-aligned column header above the first item. It is also a
# substring of the end anchor below, so both match the TOTALE EURO line. That
# only works because the end anchor is resolved first and keeps its own line; see
# find_item_region. A photo whose column header did not survive OCR is what turned
# this from a curiosity into a receipt with no items on it.
items_start_after = ["EURO"]
items_end_before = ["TOTALE EURO"]

[[rules]]
name = "total"
pattern = '(?i)\bT[O0]T\S{0,3}\s+EURO\b'

# Change has to be separated from amounts tendered: on a cash sale the payments
# exceed the total by exactly the change.
[[rules]]
name = "change"
pattern = '(?i)^\s*resto\b'

[[rules]]
name = "payment"
pattern = '(?i)\bpagamento\b'

[[rules]]
name = "discount"
pattern = '(?i)\bsconto\b'

[[rules]]
name = "noise"
pattern = '(?i)(carta\s+fidaty|raccolta\s+punti|saldo|punti|p\.i\.|^\s*euro\s*$)'
